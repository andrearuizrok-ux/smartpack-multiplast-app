name: Build SmartPack Multiplast APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify V11.2 tenant and PIN package
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/smartpack-v11.js
          test -f app/src/main/assets/service-worker.js
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/smartpackmultiplast/operations/MainActivity.java
          grep -q 'PIATTAFORMA-GRUPPO-V11.2' app/src/main/assets/index.html
          grep -q 'PIATTAFORMA-GRUPPO-V11.2' app/src/main/assets/smartpack-v11.js
          grep -q 'smartpack-v11.js' app/src/main/assets/index.html
          grep -q 'versionCode = 112' app/build.gradle.kts
          grep -q 'versionName = "11.2"' app/build.gradle.kts

      - name: Build Android APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/SmartPack-Multiplast-V11.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPack-Multiplast-V11.2-APK
          path: app/build/outputs/apk/debug/SmartPack-Multiplast-V11.2.apk
          if-no-files-found: error
