<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiorna Piattaforma Operativa Integrata</title><body style="font-family:Arial,sans-serif;padding:30px;background:#eaf4f8;color:#102331"><h2>Aggiornamento locale</h2><p>Questa pagina pulisce sessione e cache del dispositivo. <b>Non elimina i dati salvati nel database cloud.</b></p><script>(async()=>{try{sessionStorage.clear();if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if('caches'in window){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}location.href='./?v=100&t='+Date.now()})()</script></body></html>
